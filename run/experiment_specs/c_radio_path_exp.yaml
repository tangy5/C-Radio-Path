# REFERENCE spec — C-RADIO ViT-G/14 distillation training.
#
# The teacher entries below are EXAMPLE configurations: they show the expected
# schema (weights fetched separately, e.g. teachers/fetch_gigapath.sh) and are
# not statements about any particular training run. Substitute your own
# teacher models / init checkpoint as needed.
#
# Tokens __KIT_ROOT__, __DATASET_ROOT__, __RESULTS_DIR__ are rewritten by
# start_training.sh into experiment_specs/generated.yaml at launch time.

results_dir: __RESULTS_DIR__

model:
  backbone:
    # h_optimus_0 builds timm vit_giant_patch14_reg4_dinov2 (1536-dim,
    # CLS + 4 registers). Init checkpoint set via pretrained_backbone_path.
    type: h_optimus_0
    pretrained_backbone_path: __KIT_ROOT__/teachers/H-optimus-0/pytorch_model.bin
    freeze_backbone: false
    freeze_norm: false
  head:
    type: TAOLinearClsHead
    binary: false
    loss:
      type: CrossEntropyLoss
      label_smooth_val: 0.1
    topk:
    - 1
    - 5

dataset:
  root_dir: __KIT_ROOT__/run/dataset
  dataset: CLDataset
  num_classes: 0
  img_size: 224
  batch_size: 32
  workers: 8
  shuffle: true
  augmentation:
    random_flip:
      vflip_probability: 0.0
      hflip_probability: 0.5
      enable: true
    random_rotate:
      rotate_probability: 0.5
      angle_list:
      - 90.0
      - 180.0
      - 270.0
      enable: true
    random_color:
      brightness: 0.4
      contrast: 0.4
      saturation: 0.4
      hue: 0.0
      enable: true
      color_probability: 0.5
    with_scale_random_crop:
      scale_range:
      - 0.8
      - 1.2
      enable: true
    with_random_blur: false
    with_random_crop: true
    random_erase:
      enable: true
      erase_probability: 0.25
    # identity normalization here; the distiller applies per-model stats
    # (student CLIP stats, teachers their own) internally.
    mean: [0.0, 0.0, 0.0]
    std: [1.0, 1.0, 1.0]

  train_dataset:
    # the "v8 mix": ~13.17M images, 58,500 steps/epoch (7500+4100+46900)
    tar_data_sources:
    - root_dir: __DATASET_ROOT__/source_a_webdataset/1000
      samples_per_file: 10000
      scale_factor: 1.69
      steps_per_epoch: 7500
    - root_dir: __DATASET_ROOT__/source_b_webdataset
      samples_per_file: 10000
      scale_factor: 0.92
      steps_per_epoch: 4100
    - root_dir: __DATASET_ROOT__/source_c_webdataset
      samples_per_file: 10000
      scale_factor: 10.56
      steps_per_epoch: 46900
    student_patch_size: 14
    seed: 42
    full_equivariance: false
    shift_equivariance: false
    prefetch: true

  val_dataset:
    # fast-val dummy (limit_val_batches: 2); images generated by start_training.sh
    images_dir: __KIT_ROOT__/run/dataset/val_large

  test_dataset:
    images_dir: __KIT_ROOT__/run/dataset/val

train:
  num_gpus: 8
  gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
  num_nodes: 1
  seed: 42
  cudnn:
    benchmark: true
    deterministic: false
  num_epochs: 100
  checkpoint_interval: 10
  milestone_keep: 7
  latest_checkpoint_interval: 2000
  validation_interval: 1
  resume_training_checkpoint_path: null
  optim:
    monitor_name: val_loss
    optim: adamw
    lr: 0.00003
    policy: cosine
    policy_params: {}
    warmup_epochs: 2
    warmup_lr: 0.000001
    momentum: 0.9
    weight_decay: 0.05
    betas: [0.9, 0.999]
    skip_names: ["bias", "bn", "norm", "gamma", "gamma1", "gamma2", "temperature"]
  tensorboard:
    enabled: true
    infrequent_logging_frequency: 200
  enable_ema: true
  ema_decay: 0.99998
  ema:
    decay: 0.99998
  clip_grad_norm: 1.0
  mixed_precision: true
  amp_opt_level: O1
  precision: fp16
  limit_val_batches: 2

distill:
  mode: combo
  loss_type: MSE
  loss_lambda: 1.0
  pretrained_teacher_model_path: null
  use_mlp: true
  mlp_hidden_size: 2048
  mlp_num_inner: 2

  teacher:
    # Example teacher entry 0: Prov-GigaPath, ImageNet norm. Weights NOT
    # bundled — obtain via teachers/fetch_gigapath.sh.
    - model:
        backbone:
          type: prov_gigapath
          pretrained_backbone_path: __KIT_ROOT__/teachers/GigaPath/pytorch_model.bin
          freeze_backbone: true
          freeze_norm: true
      mode: combo
      input_size: 224
      match_student_resolution: true
      loss_type: MSE
      loss_lambda: 0.6
      norm_mean: [0.485, 0.456, 0.406]
      norm_std: [0.229, 0.224, 0.225]
      summary_loss_type: cosine
      summary_loss_weight: 1.0
      fd_loss_weight: 0.5

    # Example teacher entry 1: H-optimus-0, H&E norm.
    - model:
        backbone:
          type: h_optimus_0
          pretrained_backbone_path: __KIT_ROOT__/teachers/H-optimus-0/pytorch_model.bin
          freeze_backbone: true
          freeze_norm: true
      mode: combo
      input_size: 224
      match_student_resolution: true
      loss_type: MSE
      loss_lambda: 0.4
      norm_mean: [0.707223, 0.578729, 0.703617]
      norm_std: [0.211883, 0.230117, 0.177517]
      summary_loss_type: cosine
      summary_loss_weight: 1.0
      fd_loss_weight: 0.5

evaluate:
  checkpoint: null
  vis_after_n_batches: -1

export:
  results_dir: ${results_dir}/export
  gpu_id: 0
  checkpoint: null
  onnx_file: ${export.results_dir}/classifier.onnx
  input_width: 224
  input_height: 224
  batch_size: -1

inference:
  checkpoint: null
  vis_after_n_batches: -1

wandb:
  enable: false

encryption_key: tlt_enable
